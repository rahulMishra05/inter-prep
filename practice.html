    background: var(--card);
    border-radius: 4px;

  nav ul { margin: 0; padding-left: 18px; columns: 2; column-gap: 24px; }
  nav li { margin-bottom: 2px; break-inside: avoid; }
  nav a { color: var(--accent); text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  nav .n { color: var(--muted); }
  section.part {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    margin-top: 18px;
    scroll-margin-top: 130px;
  }

  .note { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  h3 { font-size: 15px; margin: 16px 0 6px; color: #374151; }
  ul.q { list-style: none; margin: 0; padding: 0; }
  ul.q li { border-top: 1px solid #eef0f2; }
  ul.q li:first-child { border-top: none; }
  ul.q label { display: flex; gap: 10px; padding: 6px 0; cursor: pointer; align-items: flex-start; }
  ul.q input { margin-top: 4px; width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
  .num { color: var(--muted); min-width: 30px; text-align: right; flex-shrink: 0; }
  .star { color: var(--star); }
  li.done .txt { color: var(--done); text-decoration: line-through; }
  .from { color: var(--muted); font-size: 13px; }
  body.hide-done li.done { display: none; }

        ["o48", "How would you design a payment or notification service using interfaces and polymorphism?"],
        ["o49", "How would you unit-test a class that depends on external services?"]
      ]}
    ]
  }
];

// Shortlist of the most likely questions. Items reference IDs above, so a tick
// here is the same tick as in the original section.
DATA.push({
  title: "Most Likely Intview Questions",
  note: "A shortlist of the questions most likely to be asked. Each one also appears in its original section, and ticking it in either place ticks both.",
  ref: true,
  groups: [
    { title: "Project and resume", items: ["q1", "q2", "q3", "q4", "q8", "q10", "q11", "q15", "q18", "q19", "q22", "q25", "q26", "q28", "q37", "q39", "q46"] },
    { title: "C# and OOP", items: ["o11", "o10", "o12", "o13", "o14", "o19", "o21", "o24", "q58", "q59", "q65", "q67"] },
    { title: "Async and concurrency", items: ["q69", "q70", "q71", "q72", "q74", "q75", "q76", "q78"] },
    { title: "ASP.NET Core and Web APIs", items: ["q81", "o43", "q84", "q88", "q90", "q91", "q92", "q93", "q95", "q100"] },
    { title: "Architecture and design patterns", items: ["o26", "o44", "o35", "o36", "q107", "q108", "q109", "q110", "q116", "q117", "q36"] },
    { title: "AI, LLMs, RAG, and agents", items: ["q123", "q124", "q126", "q128", "q133", "q135", "q137", "q138", "q139", "q142", "q146", "q152", "q154", "q159", "q164", "q167", "q169", "q174", "q178"] },
    { title: "SQL, EF Core, and Redis", items: ["q182", "q183", "q185", "q188", "q189", "q192", "q193", "q195", "q197", "q198", "q199", "q205", "sx2", "sx6"] },
    { title: "Azure, DevOps, frontend, and testing", items: ["q211", "q214", "q215", "q222", "q231", "q233", "q240", "q251", "q253"] },
    { title: "System design", items: ["q263", "q265", "q271", "q279"] },
    { title: "HR and behavioural", items: ["q347", "q348", "q350", "q351", "q352", "q356", "q358", "q359", "q362"] }
  ]
});

const TEXT = {}, ORIGIN = {};
DATA.forEach(part => {
  if (part.ref) return;
  const short = part.title.split(" — ")[0];
  part.groups.forEach(g => g.items.forEach(([id, text]) => { TEXT[id] = text; ORIGIN[id] = short; }));
});

const STORE_KEY = "practice-progress-v1";
const HIDE_KEY = "practice-hide-done";

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render() {
  const content = document.getElementById("content");
  const toc = document.getElementById("toc");
  content.innerHTML = "";
  toc.innerHTML = "";

  DATA.forEach((part, pi) => {
    const sid = "part-" + (pi + 1);
    const sec = el("section", "part");
    sec.id = sid;

    const h2 = el("h2");
    h2.appendChild(el("span", null, part.title));
    const pc = el("span", "n");
    pc.dataset.part = pi;
    h2.appendChild(pc);
    sec.appendChild(h2);
    if (part.note) sec.appendChild(el("p", "note", part.note));

    // Numbering restarts in the OOP track, otherwise runs continuously.
    let n = 0;
    part.groups.forEach(g => {
      if (g.title) sec.appendChild(el("h3", null, g.title));
      if (g.note) sec.appendChild(el("p", "note", g.note));
      const ul = el("ul", "q");
      g.items.forEach(item => {
        const id = part.ref ? item : item[0];
        const text = TEXT[id];
        n++;
        const li = el("li");
        li.dataset.id = id;
        const label = el("label");
        const cb = el("input");
        cb.type = "checkbox";
        cb.checked = !!state[id];
        cb.addEventListener("change", () => {
          if (cb.checked) state[id] = true; else delete state[id];
          document.querySelectorAll('li[data-id="' + id + '"]').forEach(other => {
            other.classList.toggle("done", cb.checked);
            other.querySelector("input").checked = cb.checked;
          });
          save();
          updateCounts();
        });
        label.appendChild(cb);
        label.appendChild(el("span", "num", n + "."));
        const txt = el("span", "txt");
        if (text.startsWith("★ ")) {
          txt.appendChild(el("span", "star", "★ "));
          txt.appendChild(document.createTextNode(text.slice(2)));
        } else {
          txt.textContent = text;
        }
        if (part.ref) {
          txt.appendChild(document.createTextNode(" "));
          txt.appendChild(el("span", "from", "(" + ORIGIN[id] + ")"));
        }
        label.appendChild(txt);
        li.appendChild(label);
        if (cb.checked) li.classList.add("done");
        ul.appendChild(li);
      });
      sec.appendChild(ul);
    });
    if (part.footer) sec.appendChild(el("p", "note", part.footer));
    content.appendChild(sec);

    const tli = el("li");
    const a = el("a", null, part.title);
    a.href = "#" + sid;
    tli.appendChild(a);
    tli.appendChild(document.createTextNode(" "));
    const tn = el("span", "n");
    tn.dataset.toc = pi;
    tli.appendChild(tn);
    toc.appendChild(tli);
  });
  updateCounts();
}

function updateCounts() {
  let all = 0, done = 0;
  DATA.forEach((part, pi) => {
    let pAll = 0, pDone = 0;
    part.groups.forEach(g => g.items.forEach(item => {
      pAll++;
      if (state[part.ref ? item : item[0]]) pDone++;
    }));
    // The shortlist repeats questions, so keep it out of the overall total.
    if (!part.ref) { all += pAll; done += pDone; }
    const label = pDone + " / " + pAll;
    document.querySelector('[data-part="' + pi + '"]').textContent = label;
    document.querySelector('[data-toc="' + pi + '"]').textContent = "(" + label + ")";
  });
  const pct = all ? Math.round(done * 100 / all) : 0;
  document.getElementById("total").textContent = done + " / " + all + " completed (" + pct + "%)";
  document.getElementById("bar").style.width = pct + "%";
}

const hide = document.getElementById("hideDone");
try { hide.checked = localStorage.getItem(HIDE_KEY) === "1"; } catch (e) {}
document.body.classList.toggle("hide-done", hide.checked);
hide.addEventListener("change", () => {
  document.body.classList.toggle("hide-done", hide.checked);
  try { localStorage.setItem(HIDE_KEY, hide.checked ? "1" : "0"); } catch (e) {}
});

document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Clear all completed checkmarks?")) {
    state = {};
    save();
    render();
  }
});

render();
</script>
</body>
